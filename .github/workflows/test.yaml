name: Test Project
on: push #whenever a new comit is pushed to this repository, this workflow runs
jobs: 
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3  # (keyword)that's how you define an action you want to use #Github Marketplace
            - name: Install NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test


